name: Acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
